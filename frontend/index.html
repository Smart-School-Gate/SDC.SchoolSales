<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rootaca-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rootaca | School Sales & Visit Manager</title>
    <script>
      // Defensively patch SVGAnimatedString so browser extensions (IDM, Google Translate, etc.)
      // do not throw "e.target.className.indexOf is not a function" when clicking SVG elements.
      if (typeof SVGAnimatedString !== 'undefined') {
        if (!SVGAnimatedString.prototype.indexOf) {
          SVGAnimatedString.prototype.indexOf = function(str, pos) {
            return (this.baseVal || '').indexOf(str, pos);
          };
        }
        if (!SVGAnimatedString.prototype.includes) {
          SVGAnimatedString.prototype.includes = function(str, pos) {
            return (this.baseVal || '').includes(str, pos);
          };
        }
      }
    </script>
    <!-- Google Fonts: Cairo & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
